charset utf-8;
server_tokens off;
client_max_body_size 51m;
gzip on;
gzip_vary on;
gzip_proxied any;
gzip_comp_level 5;
gzip_min_length 512;
gzip_types text/css text/javascript application/javascript application/json image/svg+xml;

# Only public code, bundled images and fonts bypass the application.
# Uploaded /media/ files and HTML attachments always retain application auth.
location ~ "^/static/(?:[A-Za-z0-9_-]+\.(?:js|css|svg|ico)|(?:assets|optimized|vendor)/[A-Za-z0-9_./-]+\.(?:js|css|jpg|jpeg|png|webp|svg|ico|woff|woff2|ttf))$" {
    root /opt/travel-notes;
    try_files $uri =404;
    disable_symlinks on;
    set $travel_static_cache "public, no-cache";
    if ($arg_v ~ "^[a-f0-9]{16}$") {
        set $travel_static_cache "public, max-age=31536000, immutable";
    }
    if ($uri ~ "^/static/optimized/") {
        set $travel_static_cache "public, max-age=31536000, immutable";
    }
    add_header Cache-Control $travel_static_cache;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy same-origin always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'" always;
    # Location add_header directives replace the HTTPS server's inheritance.
    add_header Strict-Transport-Security "max-age=2592000" always;
}

location / {
    proxy_pass http://127.0.0.1:8000;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 45s;
}
